<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>BEAT.VISION — Бриф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --beat:#FF2D18;
  --dim:#8A8A8A;
  --line:#242424;
  --field:#0B0B0B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000!important;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:#000!important;color:#FFFFFF!important;
  font-family:'Inter',system-ui,sans-serif;font-weight:300;
  font-size:16px;line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
header,main,section,footer,.hero{background:#000}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(0,0,0,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.bar{
  max-width:940px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo svg{display:block}
.logo span{
  font-family:'Unbounded',sans-serif;font-weight:800;
  font-size:14px;letter-spacing:.15em;text-transform:uppercase;
}
.bar small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--beat);width:0;transition:width .25s ease}

/* ---------- HERO ---------- */
.hero{
  min-height:62vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:100px 24px;border-bottom:1px solid var(--line);
}
h1{
  font-family:'Unbounded',sans-serif;font-weight:800;color:#fff;
  font-size:clamp(34px,7.5vw,72px);line-height:1.02;letter-spacing:-.02em;
  text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--beat)}

/* ---------- SECTIONS ---------- */
main{max-width:940px;margin:0 auto;padding:0 24px}
section{padding:60px 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;gap:20px;align-items:baseline;margin-bottom:38px}
.num{font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;color:var(--beat);letter-spacing:.1em;padding-top:4px}
h2{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(21px,3.4vw,29px);letter-spacing:-.01em;color:#fff}
.sec-head p{color:var(--dim);font-size:14px;margin-top:6px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.full{grid-column:1/-1}
@media(max-width:720px){.grid{grid-template-columns:1fr}}

label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
label .req{color:var(--beat)}
input,textarea,select{
  width:100%;background:var(--field);color:#fff;
  border:1px solid var(--line);border-radius:2px;
  padding:14px 15px;font-family:inherit;font-size:15px;font-weight:300;
  transition:border-color .18s ease,background .18s ease;
}
textarea{min-height:110px;resize:vertical}
select{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:#0B0B0B;color:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--beat);background:#111}
::placeholder{color:#4A4A4A}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip span{
  display:block;padding:10px 16px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;color:var(--dim);cursor:pointer;transition:all .18s ease;user-select:none;
}
.chip input:checked + span{border-color:var(--beat);color:#fff;background:rgba(255,45,24,.1)}
.chip input:focus-visible + span{outline:2px solid var(--beat);outline-offset:2px}

/* ---------- SUBMIT ---------- */
.send{padding:64px 0 88px;text-align:center}
button{
  font-family:'Unbounded',sans-serif;font-weight:600;
  background:var(--beat);color:#fff;border:none;border-radius:2px;
  padding:20px 56px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:transform .18s ease,opacity .18s ease;
}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.4;cursor:wait;transform:none}
.status{margin-top:24px;font-size:14px;min-height:22px;color:var(--dim)}
.status.ok{color:var(--beat)}
.status.err{color:#FF6B5A}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--line);padding:52px 24px;text-align:center}
footer .logo{justify-content:center}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#">
      <svg width="30" height="19" viewBox="0 0 60 38" fill="none" aria-label="BEAT.VISION">
        <path d="M2 19C2 19 12 4 30 4C48 4 58 19 58 19C58 19 48 34 30 34C12 34 2 19 2 19Z" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/>
        <path d="M22 12L30 26L38 12" stroke="#fff" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="round"/>
      </svg>
      <span>BEAT.VISION</span>
    </a>
    <small>Brief</small>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="hero">
  <h1>Tell me<br>something<em>.</em></h1>
</div>

<main>
  <section>
    <div class="sec-head"><span class="num">01</span><div><h2>Контакты</h2><p>Куда вернуться с ответом</p></div></div>
    <div class="grid">
      <div class="full"><label>Название проекта или компании <span class="req">*</span></label><input name="Name" required></div>
      <div><label>Контактное лицо</label><input name="Контактное лицо" placeholder="Имя и роль"></div>
      <div><label>Email</label><input type="email" name="Email" placeholder="you@company.com"></div>
      <div><label>Телефон или мессенджер</label><input name="Телефон / мессенджер" placeholder="+48 ..."></div>
      <div><label>Сайт</label><input type="url" name="WEB" placeholder="https://"></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><span class="num">02</span><div><h2>Компания</h2><p>Контекст, в котором работаем</p></div></div>
    <div class="grid">
      <div class="full"><label>Чем занимается компания</label><textarea name="Чем занимается компания" placeholder="Что продаёте и кому"></textarea></div>
      <div><label>Отрасль или ниша</label><input name="Отрасль / ниша"></div>
      <div><label>Стадия бизнеса</label><select name="Стадия бизнеса"><option value="">—</option><option>Стартап (до 10 чел.)</option><option>SMB (10–50 чел.)</option><option>Средний бизнес (50–200 чел.)</option><option>Enterprise (200+ чел.)</option></select></div>
      <div><label>Бизнес-модель</label><select name="Бизнес-модель"><option value="">—</option><option>B2B</option><option>B2C</option><option>B2B &amp; B2C</option><option>B2G</option></select></div>
      <div><label>Географический охват</label><select name="Географический охват"><option value="">—</option><option>Один город</option><option>Страна</option><option>Европа</option><option>Весь мир</option></select></div>
      <div class="full"><label>Целевая аудитория</label><textarea name="Целевая аудитория" placeholder="Кто покупает, как решает"></textarea></div>
      <div class="full"><label>Чем отличаетесь от конкурентов</label><textarea name="Отличие от конкурентов"></textarea></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><span class="num">03</span><div><h2>Задача</h2><p>Главный блок брифа</p></div></div>
    <div class="grid">
      <div class="full"><label>Какую проблему хотите решить <span class="req">*</span></label><textarea name="Какую проблему хотите решить" required placeholder="Что не работает сейчас"></textarea></div>
      <div class="full"><label>Три главные бизнес-цели</label><textarea name="3 главных бизнес-цели"></textarea></div>
      <div><label>Ожидаемый результат за 1–3 месяца</label><textarea name="Ожидаемый результат за 1-3 месяца"></textarea></div>
      <div><label>Как измерите успех</label><textarea name="Как измерите успех (KPI)" placeholder="Метрики и цифры"></textarea></div>
      <div class="full"><label>Направления</label><div class="chips" data-multi="Направления">
        <label class="chip"><input type="checkbox" value="Marketing"><span>Marketing</span></label>
        <label class="chip"><input type="checkbox" value="Design"><span>Design</span></label>
        <label class="chip"><input type="checkbox" value="Automation"><span>Automation</span></label>
        <label class="chip"><input type="checkbox" value="Events"><span>Events</span></label>
        <label class="chip"><input type="checkbox" value="Production"><span>Production</span></label>
      </div></div>
      <div class="full"><label>Тип контента и работ</label><div class="chips" data-multi="Тип контента и работ">
        <label class="chip"><input type="checkbox" value="Посты / подписи"><span>Посты / подписи</span></label>
        <label class="chip"><input type="checkbox" value="Reels / видео-сценарии"><span>Reels / видео-сценарии</span></label>
        <label class="chip"><input type="checkbox" value="Stories"><span>Stories</span></label>
        <label class="chip"><input type="checkbox" value="Статьи / лонгриды"><span>Статьи / лонгриды</span></label>
        <label class="chip"><input type="checkbox" value="Email-копирайтинг"><span>Email-копирайтинг</span></label>
        <label class="chip"><input type="checkbox" value="Рекламные тексты"><span>Рекламные тексты</span></label>
        <label class="chip"><input type="checkbox" value="Карусели / слайды"><span>Карусели / слайды</span></label>
        <label class="chip"><input type="checkbox" value="AI-видеопродакшн"><span>AI-видеопродакшн</span></label>
        <label class="chip"><input type="checkbox" value="Чат-бот / поддержка клиентов"><span>Чат-бот / поддержка</span></label>
        <label class="chip"><input type="checkbox" value="CRM / Email-автоматизация"><span>CRM / Email-автоматизация</span></label>
        <label class="chip"><input type="checkbox" value="Сбор данных / отчётность"><span>Сбор данных / отчётность</span></label>
        <label class="chip"><input type="checkbox" value="Внутренние workflow"><span>Внутренние workflow</span></label>
        <label class="chip"><input type="checkbox" value="Дизайн / брендинг"><span>Дизайн / брендинг</span></label>
        <label class="chip"><input type="checkbox" value="Ивент"><span>Ивент</span></label>
        <label class="chip"><input type="checkbox" value="Другое"><span>Другое</span></label>
      </div></div>
      <div class="full"><label>Платформы</label><div class="chips" data-multi="Платформы">
        <label class="chip"><input type="checkbox" value="Instagram"><span>Instagram</span></label>
        <label class="chip"><input type="checkbox" value="TikTok"><span>TikTok</span></label>
        <label class="chip"><input type="checkbox" value="LinkedIn"><span>LinkedIn</span></label>
        <label class="chip"><input type="checkbox" value="Facebook"><span>Facebook</span></label>
        <label class="chip"><input type="checkbox" value="YouTube"><span>YouTube</span></label>
        <label class="chip"><input type="checkbox" value="Блог / Сайт"><span>Блог / Сайт</span></label>
        <label class="chip"><input type="checkbox" value="Email-рассылка"><span>Email-рассылка</span></label>
        <label class="chip"><input type="checkbox" value="Другое"><span>Другое</span></label>
      </div></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><span class="num">04</span><div><h2>Бренд</h2><p>Как звучите и как выглядите</p></div></div>
    <div class="grid">
      <div><label>Тон коммуникации</label><select name="Тон коммуникации бренда"><option value="">—</option><option>Профессиональный / Экспертный</option><option>Дружелюбный / Непринуждённый</option><option>Вдохновляющий / Мотивирующий</option><option>Юмористический / Остроумный</option><option>Люкс / Премиум</option><option>Дерзкий / Провокационный</option></select></div>
      <div><label>Брендбук</label><select name="Брендбук"><option value="">—</option><option>Да — пришлю файл</option><option>Нет — нужна помощь</option><option>В процессе разработки</option></select></div>
      <div class="full"><label>Конкуренты и вдохновляющие примеры</label><textarea name="Конкуренты и вдохновляющие примеры" placeholder="Ссылки и что именно нравится"></textarea></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><span class="num">05</span><div><h2>Технологии и AI</h2><p>С чем уже работаете</p></div></div>
    <div class="grid">
      <div><label>Опыт с AI-инструментами</label><select name="Опыт с AI-инструментами"><option value="">—</option><option>Да — активно</option><option>Немного пробовали</option><option>Нет — это первый раз</option></select></div>
      <div><label>Готовность команды к AI</label><select name="Готовность команды к AI"><option value="">—</option><option>Энтузиасты</option><option>Нейтральные — нужны доказательства</option><option>Скептики</option></select></div>
      <div><label>Есть ли техническая команда</label><select name="Есть ли техническая / IT-команда"><option value="">—</option><option>Да — штатная</option><option>Частичная компетенция</option><option>На аутсорсе</option><option>Нет</option></select></div>
      <div><label>Требования к данным и GDPR</label><select name="GDPR / требования к данным"><option value="">—</option><option>Строгие требования</option><option>Стандартные требования</option><option>Не знаю — нужна консультация</option></select></div>
      <div><label>Какие AI-инструменты пробовали</label><textarea name="Какие AI-инструменты пробовали"></textarea></div>
      <div><label>Текущий стек инструментов</label><textarea name="Текущий стек инструментов" placeholder="CRM, аналитика, рассылки"></textarea></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><span class="num">06</span><div><h2>Условия</h2><p>Бюджет, сроки, формат</p></div></div>
    <div class="grid">
      <div><label>Бюджетный диапазон</label><select name="Бюджетный диапазон"><option value="">—</option><option>До 500€</option><option>500–1500€</option><option>1500–3000€</option><option>3000–7000€</option><option>7000€+</option><option>Не знаю — нужна консультация</option></select></div>
      <div><label>Формат сотрудничества</label><select name="Формат сотрудничества"><option value="">—</option><option>Разовый проект</option><option>Постоянное сотрудничество</option><option>Разовое внедрение под ключ</option><option>Ещё не определился</option></select></div>
      <div><label>Желаемая дата старта</label><input name="Желаемая дата старта" placeholder="Например: середина сентября"></div>
      <div><label>Дедлайн и важные даты</label><input name="Ключевые даты"></div>
      <div><label>Работали с агентством раньше</label><select name="Работали с агентством раньше"><option value="">—</option><option>Да</option><option>Нет</option></select></div>
      <div><label>Опыт с предыдущим агентством</label><textarea name="Опыт с предыдущим агентством" placeholder="Что сработало, что нет"></textarea></div>
      <div class="full"><label>Вопросы к нам</label><textarea name="Вопросы к нам"></textarea></div>
      <div class="full"><label>Что ещё нам стоит знать</label><textarea name="Дополнительная информация"></textarea></div>
    </div>
  </section>

  <div class="send">
    <button id="send">Отправить бриф</button>
    <div class="status" id="status"></div>
  </div>
</main>

<footer>
  <a class="logo" href="#">
    <svg width="26" height="17" viewBox="0 0 60 38" fill="none" aria-label="BEAT.VISION">
      <path d="M2 19C2 19 12 4 30 4C48 4 58 19 58 19C58 19 48 34 30 34C12 34 2 19 2 19Z" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/>
      <path d="M22 12L30 26L38 12" stroke="#fff" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="round"/>
    </svg>
    <span>BEAT.VISION</span>
  </a>
</footer>

<script>
// ⬇️ ЕДИНСТВЕННОЕ, ЧТО НУЖНО ЗАПОЛНИТЬ.
// Сюда вставляется URL вебхука, который принимает JSON и создаёт
// карточку в базе Leads. Ключ интеграции Notion СЮДА НЕ ПИШЕТСЯ —
// исходник страницы виден всем, кто её откроет.
const WEBHOOK_URL = "https://breaf-bv.agency-07e.workers.dev/";

const statusEl = document.getElementById('status');
const btn = document.getElementById('send');
const bar = document.getElementById('progress');

addEventListener('scroll', () => {
  const h = document.body.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%';
});

function collect() {
  const data = {};
  document.querySelectorAll('input[name], textarea[name], select[name]').forEach(el => {
    const v = el.value.trim();
    if (v) data[el.name] = v;
  });
  document.querySelectorAll('.chips[data-multi]').forEach(box => {
    const picked = [...box.querySelectorAll('input:checked')].map(i => i.value);
    if (picked.length) data[box.dataset.multi] = picked;
  });
  data['Status'] = '🆕 Новый лид';
  data['Отправлено'] = new Date().toISOString();
  return data;
}

btn.addEventListener('click', async () => {
  const data = collect();

  if (!data['Name']) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Заполните название проекта — без него бриф не уйдёт.';
    return;
  }
  if (!data['Какую проблему хотите решить']) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Опишите задачу — это единственное поле, без которого не обойтись.';
    return;
  }
  if (!WEBHOOK_URL) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Приём заявок ещё не подключён. Напишите нам напрямую.';
    return;
  }

  btn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = 'Отправляем…';

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(res.status);
    statusEl.className = 'status ok';
    statusEl.textContent = 'Бриф отправлен. Ответим в течение двух рабочих дней.';
    btn.textContent = 'Отправлено';
  } catch (e) {
    btn.disabled = false;
    statusEl.className = 'status err';
    statusEl.textContent = 'Не удалось отправить. Проверьте связь и попробуйте ещё раз.';
  }
});
</script>
</body>
</html>
